<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="wa-tik" content="{{TIK}}">
<meta name="referrer" content="no-referrer">
<title>WhatsApp · GodChat</title>
<style>
:root {
  --bg: #f6f5f1; --vlak: #ffffff; --lijn: #e4e1d8; --inkt: #22211e; --zacht: #6f6b62; --flauw: #a29e94;
  --accent: #3f6b52; --accent-zacht: #e3ece5; --werkt: #3d6fb4; --wacht: #b7791f; --wacht-zacht: #fbf1df;
  --fout: #b4443d; --code: #f1efe9;
  --vvh: 100dvh;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171716; --vlak: #201f1d; --lijn: #34322e; --inkt: #ecebe6; --zacht: #a7a399; --flauw: #77736b;
    --accent: #8cc0a0; --accent-zacht: #23302a; --werkt: #7ea6e0; --wacht: #e0a94f; --wacht-zacht: #2e2618;
    --fout: #e07a73; --code: #2a2926;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow-x: hidden; }
body { background: var(--bg); color: var(--inkt); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
button, textarea, select, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--lijn); background: var(--vlak); border-radius: 8px; padding: 6px 12px; min-height: 36px; }
button.hoofd { background: var(--accent); border-color: var(--accent); color: var(--vlak); }
button.wachtkleur { background: var(--wacht); border-color: var(--wacht); color: var(--vlak); }
button:disabled { opacity: .5; cursor: default; }
a { color: var(--accent); }
[hidden] { display: none !important; }

/* kop en tabs, zoals de app */
.appkop { display: flex; align-items: center; gap: 10px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); border-bottom: 1px solid var(--lijn); background: var(--vlak); }
.appkop .merk { font-size: 16px; font-weight: 700; color: var(--inkt); text-decoration: none; letter-spacing: .2px; margin-right: auto; }
.nep { background: var(--wacht-zacht); color: var(--wacht); font-size: 12px; border-radius: 6px; padding: 2px 8px; }
.ikoon { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; border-radius: 50%; border: none; background: transparent; }
.ikoon svg { width: 22px; height: 22px; }
nav.tabs { display: flex; gap: 4px; padding: 8px 16px 0; background: var(--bg); }
nav.tabs a { flex: 1; text-align: center; font-size: 14px; padding: 9px 4px; white-space: nowrap; border-radius: 8px 8px 0 0; color: var(--zacht); text-decoration: none; }
nav.tabs a.aan { background: var(--vlak); color: var(--inkt); font-weight: 600; }
.bridgebalk { background: var(--fout); color: #fff; font-size: 13px; padding: 6px 16px; text-align: center; }

/* indeling: telefoon eerst */
#app { min-height: 100%; }
#lijst { background: var(--vlak); min-height: calc(100dvh - 100px); }
#gesprek { display: none; }
body.open:not(.schuift-in):not(.schuift-uit) #lijstscherm { display: none; }
body.open #gesprek { display: flex; position: fixed; left: 0; right: 0; top: 0; height: var(--vvh); z-index: 10; }

/* chatlijst */
.zoek { padding: 10px 12px 6px; display: flex; flex-direction: column; gap: 8px; }
.zoek input { width: 100%; font-size: 16px; border: 1px solid var(--lijn); border-radius: 10px; padding: 9px 12px; background: var(--bg); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { border-radius: 999px; font-size: 13.5px; padding: 6px 12px; min-height: 34px; }
.filters button.aan { background: var(--accent-zacht); border-color: var(--accent); color: var(--inkt); font-weight: 600; }
.filters .tel { color: var(--wacht); font-weight: 700; margin-left: 4px; }
#chats { list-style: none; margin: 0; padding: 0 0 calc(24px + env(safe-area-inset-bottom)); }
#chats li { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; column-gap: 12px; align-items: center; padding: 10px 14px; cursor: pointer; min-height: 68px; border-bottom: 1px solid var(--bg); -webkit-tap-highlight-color: transparent; }
#chats li:hover { background: var(--bg); }
#chats li.gekozen { background: var(--accent-zacht); }
.rond { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 17px; flex: none; user-select: none; }
.rond svg { width: 24px; height: 24px; }
.rond.klein { width: 36px; height: 36px; font-size: 14px; }
.rond.klein svg { width: 18px; height: 18px; }
.midden { min-width: 0; }
.rij1 { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.rij1 .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.label { font-size: 11px; font-weight: 600; border-radius: 5px; padding: 1px 6px; white-space: nowrap; flex: none; }
.rij2 { font-size: 13.5px; color: var(--zacht); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rij2 .wie { color: var(--inkt); }
.rechtskol { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 12px; color: var(--flauw); }
.merk-k { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; }
.merk-k.klad { background: var(--accent); color: var(--vlak); }
.merk-k.vraag { background: var(--wacht); color: var(--vlak); }
.merk-k.lus { border: 1px solid var(--lijn); color: var(--zacht); font-weight: 600; }
.merkjes { display: flex; gap: 4px; }
/* wie wacht op jou */
#chats li.metvink { grid-template-columns: 48px minmax(0, 1fr) auto 44px; column-gap: 10px; padding-right: 6px; }
.wachttijd { color: var(--wacht); font-weight: 600; white-space: nowrap; }
.bol { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--wacht); margin-right: 5px; vertical-align: 1px; }
.vink { width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 50%; display: grid; place-items: center; color: var(--zacht); flex: none; }
.vink svg { width: 20px; height: 20px; }
.vink:hover { color: var(--accent); border-color: var(--accent); }
#chats li.deelkop { display: block; min-height: 0; padding: 14px 14px 4px; cursor: default; font-size: 12px; font-weight: 700; color: var(--zacht); text-transform: uppercase; letter-spacing: .04em; border-bottom: none; }
#chats li.deelkop:hover { background: none; }
#chats li.klapregel { display: flex; min-height: 48px; padding: 0 14px; font-size: 14px; color: var(--zacht); gap: 8px; }
.wachtregel { display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 12px; background: var(--wacht-zacht); color: var(--wacht); font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--lijn); flex: none; }
.wachtregel > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wachtregel button { min-height: 36px; padding: 4px 14px; border-radius: 999px; font-size: 13px; flex: none; }
.leeg { padding: 30px 16px; color: var(--zacht); text-align: center; }

/* gesprek */
#gesprek { flex-direction: column; background: var(--bg); min-width: 0; }
.gbalk { display: flex; align-items: center; gap: 8px; padding: 6px 8px; padding-top: calc(6px + env(safe-area-inset-top)); background: var(--vlak); border-bottom: 1px solid var(--lijn); flex: none; }
.gbalk .titel { min-width: 0; flex: 1; }
.gbalk .titel b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15.5px; }
.gbalk .titel span { display: block; font-size: 12.5px; color: var(--zacht); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#berichten { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 10px 12px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.meerlaad { text-align: center; font-size: 12.5px; color: var(--flauw); padding: 8px; }
.dag { text-align: center; margin: 12px 0 8px; }
.dag span { background: var(--vlak); border: 1px solid var(--lijn); color: var(--zacht); font-size: 12px; border-radius: 999px; padding: 3px 10px; }
.br { display: flex; margin: 3px 0; }
.br.mij { justify-content: flex-end; }
.ballon { position: relative; max-width: min(82%, 560px); background: var(--vlak); border: 1px solid var(--lijn); border-radius: 12px; padding: 6px 9px 4px; overflow-wrap: anywhere; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.br.mij .ballon { background: var(--accent-zacht); border-color: transparent; }
.ballon .afz { font-size: 12.5px; font-weight: 600; margin-bottom: 1px; }
.ballon .tx { white-space: pre-wrap; }
.ballon .tx code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); border-radius: 4px; padding: 0 3px; }
.ballon .voet { font-size: 11px; color: var(--flauw); text-align: right; margin-top: 1px; display: flex; gap: 6px; justify-content: flex-end; }
.ballon.weg .tx { font-style: italic; color: var(--zacht); }
.ballon.droog, .br.mij .ballon.droog { border: 1.5px dashed var(--wacht); background: var(--wacht-zacht); }
.ballon .droogregel { font-size: 11.5px; color: var(--wacht); font-weight: 600; }
.ballon.flits { outline: 2px solid var(--accent); }
.citaat { border-left: 3px solid var(--accent); background: rgba(127,127,127,.09); border-radius: 6px; padding: 4px 8px; margin: 2px 0 4px; font-size: 13px; cursor: pointer; }
.citaat b { display: block; font-size: 12px; }
.citaat span { display: block; color: var(--zacht); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reacties { display: flex; gap: 4px; flex-wrap: wrap; margin: -2px 0 4px; }
.br.mij .reacties { justify-content: flex-end; }
.chip { background: var(--vlak); border: 1px solid var(--lijn); border-radius: 999px; font-size: 13px; padding: 0 7px; line-height: 22px; }
.chip.mij { border-color: var(--accent); }
.chip.droog { border-style: dashed; border-color: var(--wacht); }
.foto { display: block; max-width: 100%; width: 260px; max-height: 340px; object-fit: cover; border-radius: 8px; margin: 2px 0 4px; cursor: zoom-in; background: var(--code); }
.sticker { width: 120px; height: 120px; object-fit: contain; display: block; }
.tegel { display: flex; align-items: center; gap: 10px; min-height: 52px; width: 240px; max-width: 100%; text-align: left; border-radius: 8px; background: var(--code); border: none; padding: 8px 10px; margin: 2px 0 4px; color: var(--inkt); text-decoration: none; }
.tegel .ic { font-size: 20px; width: 28px; text-align: center; flex: none; }
.tegel small { display: block; color: var(--zacht); font-size: 12px; }
.tegel .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.tegel > span:last-child { min-width: 0; }
video.speler { width: 260px; max-width: 100%; border-radius: 8px; display: block; margin: 2px 0 4px; }
audio { width: 250px; max-width: 100%; display: block; margin: 2px 0 4px; height: 40px; }
.uitknop { font-size: 12.5px; padding: 4px 10px; min-height: 32px; margin: 0 0 4px; }
.uitgeschreven { font-size: 13.5px; color: var(--zacht); border-left: 2px solid var(--lijn); padding-left: 8px; margin: 2px 0 4px; white-space: pre-wrap; }
.zweef { position: absolute; top: 2px; right: 2px; display: none; width: 28px; height: 28px; min-height: 0; padding: 0; border-radius: 50%; font-size: 15px; line-height: 1; opacity: .85; }
#nieuwknop { position: absolute; right: 14px; bottom: 12px; border-radius: 999px; background: var(--accent); color: var(--vlak); border: none; font-weight: 600; box-shadow: 0 2px 10px rgba(0,0,0,.2); min-height: 40px; }
.geswrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* klad en vraagkaart */
.kladrij { display: flex; justify-content: flex-end; margin: 10px 0 4px; }
.kladrij .ballon { border: 1.5px dashed var(--accent); background: var(--vlak); max-width: min(92%, 560px); -webkit-user-select: text; user-select: text; }
.kladrij .kop { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 2px; display: flex; gap: 8px; align-items: baseline; }
.kladrij .kop .sp { flex: 1; }
.knoppen { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.knoppen button { min-height: 44px; flex: 1 1 auto; font-weight: 600; }
.knoppen button.bevestig { background: var(--fout); border-color: var(--fout); color: #fff; }
.linkknop { border: none; background: none; padding: 4px 0; color: var(--accent); font-size: 12.5px; min-height: 0; }
.vraagdetail { font-size: 13.5px; margin-top: 8px; border-top: 1px solid var(--lijn); padding-top: 8px; }
.vraagdetail .ctx { color: var(--zacht); font-size: 13px; margin-top: 4px; white-space: pre-wrap; }
.kaart { margin: 10px 2px 4px; border: 1px solid var(--lijn); border-left: 3px solid var(--wacht); border-radius: 10px; padding: 10px 12px; background: var(--vlak); }
.kaart .meta { font-size: 12px; color: var(--wacht); font-weight: 700; }
.kaart h3 { font-size: 15.5px; margin: 4px 0; line-height: 1.35; }
.kaart .ctx { font-size: 13px; color: var(--zacht); white-space: pre-wrap; }
.kaart details { margin-top: 6px; }
.kaart summary { cursor: pointer; color: var(--accent); font-size: 13px; min-height: 32px; }
.kaart pre { white-space: pre-wrap; word-break: break-word; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); border-radius: 8px; padding: 8px; margin: 4px 0 0; }

/* onderaan: snelknoppen en invoer */
.onder { position: relative; flex: none; background: var(--vlak); border-top: 1px solid var(--lijn); padding: 6px 8px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
.snel { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
.snel button { white-space: nowrap; border-radius: 999px; font-size: 13px; padding: 5px 12px; min-height: 36px; flex: none; }
.bezetregel { font-size: 12.5px; color: var(--zacht); padding: 0 4px 6px; }
.strook { display: flex; align-items: center; gap: 8px; background: var(--bg); border-left: 3px solid var(--accent); border-radius: 6px; padding: 4px 4px 4px 8px; margin-bottom: 6px; font-size: 13px; }
.strook > span { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strook.koppel { border-left-color: var(--wacht); }
.strook button { width: 36px; height: 36px; padding: 0; border: none; background: none; flex: none; }
.invoer { display: flex; align-items: flex-end; gap: 6px; }
.invoer textarea { flex: 1; min-width: 0; font-size: 16px; line-height: 1.35; border: 1px solid var(--lijn); border-radius: 20px; padding: 10px 14px; background: var(--bg); resize: none; max-height: 40vh; min-height: 44px; }
.mic { width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 50%; display: grid; place-items: center; flex: none; }
.mic svg { width: 19px; height: 19px; }
.mic.neemt { background: var(--fout); border-color: var(--fout); color: #fff; animation: puls 1.4s ease-in-out infinite; }
.mic.schrijft { opacity: .6; cursor: progress; }
@keyframes puls { 50% { opacity: .45; } }
/* bijlagen: paperclip, menu, strook boven het invoerveld, sleeplaag */
.clip { width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 50%; display: grid; place-items: center; flex: none; border: none; background: transparent; }
.clip svg { width: 21px; height: 21px; }
.clipmenu { position: absolute; left: 8px; bottom: calc(100% + 4px); z-index: 20; background: var(--vlak); border: 1px solid var(--lijn); border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18); padding: 4px; min-width: 200px; }
.clipmenu button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; border: none; background: none; text-align: left; font-size: 15px; border-radius: 8px; padding: 0 10px; }
.clipmenu button:hover { background: var(--bg); }
.clipmenu .ic { width: 22px; text-align: center; color: var(--zacht); }
.verstopt { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }
#bijlagen { display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; padding: 2px 0 8px; overscroll-behavior-x: contain; max-width: 100%; }
.bijl { position: relative; flex: none; width: 96px; border: 1px solid var(--lijn); border-radius: 10px; background: var(--bg); padding: 4px; font-size: 11.5px; line-height: 1.3; }
.bijl .beeld { display: grid; place-items: center; width: 100%; height: 64px; border-radius: 6px; object-fit: cover; background: var(--code); font-size: 22px; color: var(--zacht); }
.bijl .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
.bijl .st { display: block; color: var(--zacht); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bijl.bezig .st { color: var(--wacht); font-weight: 600; }
.bijl.fout { border-color: var(--fout); }
.bijl.fout .st { color: var(--fout); font-weight: 600; white-space: normal; }
.bijl .weg { position: absolute; top: 2px; right: 2px; width: 30px; height: 30px; min-height: 0; padding: 0; border-radius: 50%; border: none; background: rgba(0,0,0,.55); color: #fff; font-size: 14px; line-height: 1; }
.sleeplaag { position: absolute; inset: 0; z-index: 25; display: grid; place-items: center; border: 3px dashed var(--accent); border-radius: 6px; background: rgba(63,107,82,.14); background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 700; font-size: 18px; pointer-events: none; }
.ballon .bijlagenrij { display: flex; flex-direction: column; gap: 2px; }
/* spraakbericht: opnamebalk in de plaats van het invoerveld, blokje in de strook, speelknop */
.opnamebalk { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.opnamebalk > button { min-height: 44px; border-radius: 22px; padding: 0 14px; font-weight: 600; flex: none; }
.opnamemid { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; justify-content: center; font-variant-numeric: tabular-nums; font-size: 15px; }
.opnamemid .stip { width: 12px; height: 12px; border-radius: 50%; background: var(--fout); flex: none; animation: puls 1.4s ease-in-out infinite; }
.opnamemid .meter { flex: 1; max-width: 160px; min-width: 30px; height: 8px; border-radius: 4px; background: var(--bg); border: 1px solid var(--lijn); overflow: hidden; }
.opnamemid .meter > span { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left center; transform: scaleX(0); transition: transform 80ms linear; }
.bijl.spraak { width: 200px; display: flex; align-items: center; gap: 4px; padding: 0 0 0 4px; }
.bijl.spraak .speel { width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 50%; border: none; background: var(--accent); color: var(--vlak); font-size: 16px; flex: none; }
.bijl.spraak .tx2 { flex: 1; min-width: 0; }
.bijl.spraak .weg { position: static; width: 44px; height: 44px; background: none; color: var(--zacht); font-size: 16px; flex: none; }
.tegel .speel + span .nm { white-space: normal; }
.tegel .speel { width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 50%; border: none; background: var(--accent); color: var(--vlak); font-size: 16px; flex: none; }
#stuurknop { min-height: 44px; border-radius: 22px; padding: 0 14px; font-weight: 600; flex: none; }
#stuurknop.droog { background: var(--wacht); border-color: var(--wacht); color: var(--vlak); }
#stuurknop.echt { background: var(--accent); border-color: var(--accent); color: var(--vlak); }

/* blad onderaan, foto groot, melding */
.achter { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.blad { background: var(--vlak); width: 100%; max-width: 560px; border-radius: 16px 16px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto; }
.blad h3 { margin: 2px 0 10px; font-size: 16px; }
.blad p.uitleg { margin: 0 0 10px; font-size: 13px; color: var(--zacht); }
.blad .actie { display: block; width: 100%; text-align: left; min-height: 48px; border: none; border-bottom: 1px solid var(--lijn); border-radius: 0; background: none; font-size: 15.5px; padding: 0 6px; }
.blad .actie:last-child { border-bottom: none; }
.blad label { display: block; font-size: 13px; color: var(--zacht); margin: 8px 0 4px; }
.blad input, .blad select, .blad textarea { width: 100%; font-size: 16px; border: 1px solid var(--lijn); border-radius: 10px; padding: 9px 11px; background: var(--bg); }
.blad textarea { min-height: 110px; resize: vertical; }
.blad .metmic { display: flex; gap: 6px; align-items: flex-end; }
.blad .metmic textarea { flex: 1; }
.blad .knoppen { justify-content: flex-end; }
.blad .knoppen button { flex: 0 1 auto; min-width: 110px; }
.blad .emojis { display: flex; gap: 4px; flex-wrap: wrap; padding: 4px 0 8px; border-bottom: 1px solid var(--lijn); }
.blad .emojis button { font-size: 22px; width: 46px; height: 46px; padding: 0; border-radius: 50%; border: none; background: var(--bg); }
.schakel { display: flex; align-items: center; gap: 10px; min-height: 48px; font-size: 15.5px; }
.schakel input { width: 22px; height: 22px; flex: none; }
.stilregel { font-size: 13px; color: var(--zacht); margin: 4px 0; }
.fotogroot { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.92); display: grid; place-items: center; }
.fotogroot img { max-width: 100vw; max-height: 100dvh; object-fit: contain; }
.fotogroot button { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 10px; color: #fff; background: rgba(255,255,255,.15); border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 20px; }
#melding { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom)); z-index: 50; background: var(--inkt); color: var(--bg); border-radius: 10px; padding: 10px 14px; font-size: 14px; max-width: min(92vw, 520px); box-shadow: 0 4px 18px rgba(0,0,0,.25); }
#melding.fout { background: var(--fout); color: #fff; }
#melding a { color: inherit; font-weight: 700; margin-left: 8px; }

/* breed scherm: twee kolommen */
@media (hover: hover) and (pointer: fine) {
  .br:hover .zweef { display: block; }
}
@media (min-width: 960px) {
  html, body { overflow: hidden; }
  #app { height: 100vh; display: flex; flex-direction: column; }
  nav.tabs { display: none; }
  .appkop nav.breedlinks { display: flex; }
  #hoofd { flex: 1; min-height: 0; display: grid; grid-template-columns: 360px minmax(0, 1fr); }
  #lijstscherm { display: flex !important; flex-direction: column; min-height: 0; border-right: 1px solid var(--lijn); background: var(--vlak); }
  #lijst { flex: 1; overflow-y: auto; min-height: 0; }
  #gesprek, body.open #gesprek { display: flex; position: relative; height: auto; min-height: 0; }
  .gbalk .terug { display: none; }
  #hoofd #leegrechts { display: grid; }
  body.open #hoofd #leegrechts { display: none; }
  body:not(.open) #gesprek { display: none; }
  .ballon { max-width: min(70%, 620px); }
  #berichten { padding: 10px 6% 14px; }
  .onder { padding-left: 6%; padding-right: 6%; }
  .blad { border-radius: 16px; margin-bottom: 8vh; }
  .achter { align-items: center; }
}
.appkop .breedlinks { display: none; gap: 14px; font-size: 14px; }
.appkop .breedlinks a { color: var(--zacht); text-decoration: none; }
.appkop .breedlinks a.aan { color: var(--inkt); font-weight: 600; }
#leegrechts { display: none; place-items: center; color: var(--flauw); font-size: 14px; background: var(--bg); }

/* --- beweging: alleen transform en opacity, kort; "minder beweging" zet alles uit --- */
/* dezelfde maat als de rest van de app (afgesproken met god--godchat-ui, staat ook in index.html) */
:root { --snel: 160ms; --gewoon: 260ms; --traag: 340ms; --uit: cubic-bezier(.2,.8,.2,1); --in: cubic-bezier(.4,0,1,1); }
@keyframes schuif-in { from { transform: translateX(100%); } to { transform: none; } }
@keyframes schuif-uit { from { transform: none; } to { transform: translateX(100%); } }
@keyframes lijst-weg { from { transform: none; opacity: 1; } to { transform: translateX(-22%); opacity: .55; } }
@keyframes lijst-terug { from { transform: translateX(-22%); opacity: .55; } to { transform: none; opacity: 1; } }
@keyframes vervaag-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes vervaag-uit { from { opacity: 1; } to { opacity: 0; } }
@keyframes op-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes blad-op { from { transform: translateY(100%); } to { transform: none; } }
@keyframes blad-neer { from { transform: none; } to { transform: translateY(100%); } }
@keyframes zoem-in { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@keyframes zoem-uit { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(.96); } }
@keyframes ballon-links { from { opacity: 0; transform: translate(-10px, 6px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes ballon-rechts { from { opacity: 0; transform: translate(10px, 6px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes menu-in { from { opacity: 0; transform: translateY(6px) scale(.94); } to { opacity: 1; transform: none; } }
@keyframes melding-in { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes knop-in { from { opacity: 0; transform: translateY(8px) scale(.9); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: no-preference) {
  @view-transition { navigation: auto; }   /* tussen Dashboard en WhatsApp: een zachte overgang in plaats van een sprong */
  body.schuift-in #gesprek { animation: schuif-in var(--traag) var(--uit) both; box-shadow: -8px 0 24px rgba(0,0,0,.12); }
  body.schuift-in #lijstscherm { animation: lijst-weg var(--traag) var(--uit) both; }
  body.schuift-uit #gesprek { animation: schuif-uit var(--gewoon) var(--in) both; box-shadow: -8px 0 24px rgba(0,0,0,.12); }
  body.schuift-uit #lijstscherm { animation: lijst-terug var(--gewoon) var(--in) both; }
  #gesprek.wissel #berichten, #gesprek.wissel .gbalk { animation: vervaag-in var(--snel) ease-out both; }
  .ballon.in { animation: ballon-links var(--gewoon) var(--uit) both; }
  .br.mij .ballon.in, .ballon.mij.in, .ballon.droog.in { animation-name: ballon-rechts; }
  .in-kaart { animation: op-in var(--gewoon) var(--uit) both; }
  .achter { animation: vervaag-in var(--snel) ease-out both; }
  .achter .blad { animation: blad-op var(--gewoon) var(--uit) both; }
  .achter.dicht { animation: vervaag-uit var(--snel) ease-in both; }
  .achter.dicht .blad { animation: blad-neer var(--snel) var(--in) both; }
  .fotogroot { animation: vervaag-in var(--snel) ease-out both; }
  .fotogroot img { animation: zoem-in var(--gewoon) var(--uit) both; }
  .fotogroot.dicht { animation: vervaag-uit var(--snel) ease-in both; }
  .fotogroot.dicht img { animation: zoem-uit var(--snel) ease-in both; }
  .clipmenu:not([hidden]) { animation: menu-in var(--snel) var(--uit) both; transform-origin: 12px 100%; }
  #melding:not([hidden]) { animation: melding-in var(--snel) var(--uit) both; }
  #nieuwknop:not([hidden]) { animation: knop-in var(--snel) var(--uit) both; }
  #antwoordstrook:not([hidden]), #bijlagen:not([hidden]), #wachtregel:not([hidden]), #bezetregel:not([hidden]),
  #opnamebalk:not([hidden]) { animation: op-in var(--gewoon) var(--uit) both; }
  #chats.wissel { animation: vervaag-in var(--snel) ease-out both; }
  button, #chats li { transition: transform var(--snel) var(--uit), background-color var(--snel) ease, opacity var(--snel) ease; }
  button:active:not(:disabled) { transform: scale(.96); }
  #chats li:active { background: var(--bg); }
  #berichten { scroll-behavior: auto; }
}
@media (min-width: 960px) and (prefers-reduced-motion: no-preference) {
  .achter .blad { animation: zoem-in var(--gewoon) var(--uit) both; }
  .achter.dicht .blad { animation: zoem-uit var(--snel) ease-in both; }
}

/* dicteren: een regel boven het veld zolang je opneemt of het uitschrijven loopt */
.dicteerstand { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--zacht); padding: 2px 4px 6px; font-variant-numeric: tabular-nums; animation: gc-dicteer var(--snel, 160ms) var(--uit, ease-out) both; }
.dicteerstand.neemt { color: var(--fout); font-weight: 600; }
.dicteerstand .stip { width: 10px; height: 10px; border-radius: 50%; background: var(--fout); flex: none; animation: puls 1.4s ease-in-out infinite; }
.dicteerstand .draai, .mic.schrijft::after { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--lijn); border-top-color: var(--accent); flex: none; animation: gc-draai .8s linear infinite; }
.mic { position: relative; }
.mic.schrijft { opacity: 1; cursor: progress; }
.mic.schrijft svg { opacity: .25; }
.mic.schrijft::after { content: ""; position: absolute; inset: 0; margin: auto; width: 22px; height: 22px; box-sizing: border-box; }
@keyframes gc-draai { to { transform: rotate(360deg); } }
@keyframes gc-dicteer { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .dicteerstand .draai, .mic.schrijft::after { animation-duration: 2.4s; } }
</style>
</head>
<body>
<div id="app">

<script nonce="{{NONCE}}">
"use strict";
const $ = (id) => document.getElementById(id);
const TIK = document.querySelector('meta[name="wa-tik"]').content;
const AANRAAK = matchMedia("(pointer: coarse)").matches;
const KLANTKLEUR = { "god": "#6b5ea8" };   // de God-chat vast; elke klant krijgt een kleur uit zijn sleutel (kleurUit)
const GROEP_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 13.6c2.4.2 4 1.8 4.5 4.4"/></svg>';
const MIC_SVG = $("mic").innerHTML;

const s = {
  chats: new Map(), volgorde: [], max: 0, kv: "", kladden: {}, versturen: "droog", echt: false, nep: false, proef: false,
  zelf: "", klanten: [], bridge: {}, filter: "alles", zoek: "", wachtN: 0, afgerondOpen: false,
  open: null, berichten: [], cursor: null, meer: false, laadt: false, droog: [], kaarten: [],
  concepten: {}, antwoordOp: null, koppel: null, bezig: false, uitschrijven: {}, droogReacties: {},
  knopen: new Map(),
  bijlagen: {}, droogBeelden: {},   // bijlagen per gesprek (tot herladen); beelden van droogloopberichten per bericht-id
};
const MAX_BIJLAGE = 100 * 1024 * 1024, MAX_BIJLAGEN = 10;

// --- hulp ---------------------------------------------------------------------------------------------------------
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "style") Object.assign(e.style, v);
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : String(v));
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return e;
}
function svg(html) { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstChild; }   // alleen vaste, eigen iconen
function kleurUit(tekst) { let h = 0; for (const c of String(tekst)) h = (h * 31 + c.codePointAt(0)) >>> 0; return `hsl(${h % 360} 38% 44%)`; }
function initialen(naam) {
  const w = String(naam || "").replace(/[^\p{L}\p{N}\s]/gu, " ").trim().split(/\s+/).filter(Boolean);
  if (!w.length) return "#";
  return (w[0][0] + (w.length > 1 ? w[w.length - 1][0] : "")).toUpperCase();
}
function rondje(c, klein) {
  const r = el("div", { class: "rond" + (klein ? " klein" : "") });
  if (c.zelf) { r.textContent = "Jij"; r.style.background = "var(--accent)"; r.style.fontSize = klein ? "12px" : "14px"; }
  else if (c.groep) { r.append(svg(GROEP_SVG)); r.style.background = kleurUit(c.jid); }
  else { r.textContent = initialen(c.naam); r.style.background = kleurUit(c.naam); }
  return r;
}
function klantLabel(sleutel, naam) {
  const k = KLANTKLEUR[sleutel] || kleurUit(sleutel);
  return el("span", { class: "label", style: { background: k, color: "#fff" } }, naam || sleutel);
}
const DAG = ["zo", "ma", "di", "wo", "do", "vr", "za"], MAAND = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
const twee = (n) => String(n).padStart(2, "0");
function uurVan(ts) { const d = new Date(ts * 1000); return twee(d.getHours()) + ":" + twee(d.getMinutes()); }
function dagStart(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
function lijstTijd(ts) {
  if (!ts) return "";
  const d = new Date(ts * 1000), nu = new Date(), dagen = Math.round((dagStart(nu) - dagStart(d)) / 864e5);
  if (dagen <= 0) return uurVan(ts);
  if (dagen === 1) return "gisteren";
  if (dagen < 7) return ["zondag", "maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag"][d.getDay()];
  return twee(d.getDate()) + "/" + twee(d.getMonth() + 1) + (d.getFullYear() !== nu.getFullYear() ? "/" + String(d.getFullYear()).slice(2) : "");
}
function dagNaam(ts) {
  const d = new Date(ts * 1000), nu = new Date(), dagen = Math.round((dagStart(nu) - dagStart(d)) / 864e5);
  if (dagen <= 0) return "Vandaag";
  if (dagen === 1) return "Gisteren";
  return `${DAG[d.getDay()]} ${d.getDate()} ${MAAND[d.getMonth()]}` + (d.getFullYear() !== nu.getFullYear() ? " " + d.getFullYear() : "");
}
function grootte(n) { if (!n) return ""; if (n < 1024) return n + " B"; if (n < 1048576) return Math.round(n / 1024) + " kB"; return (n / 1048576).toFixed(1).replace(".", ",") + " MB"; }
const MEDIAWOORD = { image: "Foto", video: "Video", audio: "Spraakbericht", document: "Document", sticker: "Sticker" };

// Tekst van vreemden: alleen als tekstknopen. Links (http/https) en WhatsApp-opmaak worden als eigen elementen gebouwd.
function opmaak(tekst, ouder) {
  const re = /https?:\/\/[^\s<>"'`]+/g;
  let i = 0;
  for (const m of tekst.matchAll(re)) {
    let url = m[0].replace(/[.,;:!?)\]}»]+$/, "");
    stijl(tekst.slice(i, m.index), ouder);
    ouder.append(el("a", { href: url, target: "_blank", rel: "noopener noreferrer" }, url));
    i = m.index + url.length;
  }
  stijl(tekst.slice(i), ouder);
}
function stijl(t, ouder) {
  if (!t) return;
  const re = /(^|[\s(\[{"'])([*_~`])([^\s*_~`](?:[^\n]*?[^\s])?)\2(?=$|[\s.,;:!?)\]}"'])/g;
  let i = 0;
  for (const m of t.matchAll(re)) {
    const start = m.index + m[1].length;
    ouder.append(document.createTextNode(t.slice(i, start)));
    const tag = { "*": "b", "_": "i", "~": "s", "`": "code" }[m[2]];
    ouder.append(el(tag, null, m[3]));
    i = start + m[2].length * 2 + m[3].length;
  }
  ouder.append(document.createTextNode(t.slice(i)));
}

function melding(tekst, fout, link) {
  const m = $("melding");
  m.replaceChildren(document.createTextNode(tekst));
  if (link) m.append(link);
  m.className = fout ? "fout" : ""; m.hidden = false;
  clearTimeout(melding.t); melding.t = setTimeout(() => (m.hidden = true), link ? 9000 : fout ? 7000 : 3500);
}


// --- beweging: alleen als de gebruiker geen "minder beweging" vroeg; transform en opacity in CSS ---------------------
const RUSTIG = matchMedia("(prefers-reduced-motion: reduce)"), SMAL = matchMedia("(max-width: 959px)");
function naAnimatie(knoop, ms) {   // wacht op het einde van de animatie van precies deze knoop (met een vangnet)
  return new Promise((klaar) => {

      melding(r.melding || (s.echt ? "Echt versturen staat aan." : "Versturen staat op droogloop."));
      sluit();
    } catch (e) { melding(e.message, true); schakel.checked = !aan; }
  });
  test.addEventListener("click", async () => {
    if (!s.zelf) return melding("Geen eigen chat bekend in routing.json.", true);
    test.disabled = true;
    try {
      const r = await stuurPost("/api/wa/stuur", { chat: s.zelf, tekst: "[God] test vanuit de WhatsApp-tab" });
      melding(r.droog ? "Droogloop: testregel niet verstuurd." : "Testregel verstuurd naar je eigen chat.");
      if (r.droog && s.open === s.zelf) { s.droog.push(r.bericht); tekenBerichten(); naarOnder(); }
      sluit();
    } catch (e) { melding(e.message, true); test.disabled = false; }
  });
}

// --- verversen -----------------------------------------------------------------------------------------------------------------
function zetAlgemeen(d) {
  if ("versturen" in d) s.versturen = d.versturen;
  if ("echt" in d) s.echt = !!d.echt;
  if (d.bridge) s.bridge = d.bridge;
  const b = s.bridge || {};
  const nummerMis = b.nummer === false || ("nummer" in b && b.nummer == null);   // de store is niet (aantoonbaar) van het eigen nummer
  const los = !b.proef && (b.ok === false || b.verbonden === false);
  $("bridgebalk").hidden = !(nummerMis || los);
  $("bridgebalk").textContent = nummerMis ? bridgeTekst() : "De WhatsApp-bridge is niet verbonden: berichten komen niet binnen en versturen lukt niet.";
  tekenStuurknop();
}
async function laadLijst() {
  const d = await haal("/api/wa/chats");
  s.chats.clear();
  s.max = d.max; s.nep = d.nep; s.proef = d.proef; s.zelf = d.zelf; s.klanten = d.klanten; s.kv = d.kv; s.kladden = d.kladden || {};
  s.wachtN = d.wacht_n || 0;
  zetChats(d.chats); zetAlgemeen(d); tekenLijst();
}
let polsBezig = false, laatsteVol = Date.now();
async function pols() {
  if (polsBezig || document.hidden) return;
  polsBezig = true;
  try {
    const d = await haal("/api/wa/pols?" + new URLSearchParams({ na: s.max, chat: s.open || "", kv: s.kv }));
    zetAlgemeen(d);
    if (d.herlaad) { await laadLijst(); if (s.open) { const j = s.open; s.open = null; openChat(j, false); } return; }
    s.max = d.max;
    if ("wacht_n" in d) s.wachtN = d.wacht_n;
    let lijstAnders = false;
    if (d.chats && d.chats.length) { zetChats(d.chats); lijstAnders = true; if (s.open && d.chats.some((c) => c.jid === s.open)) tekenKop(); }
    if (d.kv) {
      s.kv = d.kv; s.kladden = d.kladden || {};
      for (const [jid, c] of s.chats) { const t = (d.tellers || {})[jid] || [0, 0]; if (c.klad !== t[0] || c.vraag !== t[1]) { c.klad = t[0]; c.vraag = t[1]; lijstAnders = true; } }
      if (s.open) { s.kaarten = s.kladden[s.open] || []; tekenBerichten(); }
    }
    if (lijstAnders) tekenLijst();
    if (s.open && d.berichten && d.berichten.length) {
      const onder = opDeBodem();
      let nieuw = false;
      for (const b of d.berichten) {
        const i = s.berichten.findIndex((x) => x.id === b.id);
        if (i >= 0) s.berichten[i] = b; else { s.berichten.push(b); nieuw = true; }
      }
      sorteer(); tekenBerichten();
      if (onder) naarOnder(true); else if (nieuw) $("nieuwknop").hidden = false;
    }
    if (s.open && Date.now() - laatsteVol > 30000) { laatsteVol = Date.now(); volOpnieuw(); }
  } catch (e) { /* volgende keer opnieuw */ }
  finally { polsBezig = false; }
}
async function volOpnieuw() {   // het zichtbare stuk opnieuw: bewerkingen, verwijderingen, nieuwe reacties
  const jid = s.open; if (!jid) return;
  try {
    const n = Math.min(Math.max(s.berichten.length, 30), 200);
    const d = await haal("/api/wa/berichten?" + new URLSearchParams({ chat: jid, n }));
    if (s.open !== jid) return;
    if (d.chat) { zetChats([d.chat]); tekenKop(); }
    const nieuw = new Map(d.berichten.map((b) => [b.id, b]));
    s.berichten = s.berichten.map((b) => nieuw.get(b.id) || b);
    const ids = new Set(s.berichten.map((b) => b.id));
    for (const b of d.berichten) if (!ids.has(b.id)) s.berichten.push(b);
    sorteer();
    s.kaarten = d.kladden || []; s.droog = d.droog || s.droog;
    const onder = opDeBodem();
    tekenBerichten(); if (onder) naarOnder(true);
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) pols(); });

// het invoerveld boven het schermtoetsenbord houden
if (window.visualViewport) {
  const vv = window.visualViewport;
  const pas = () => {
    document.documentElement.style.setProperty("--vvh", vv.height + "px");
    if (document.body.classList.contains("open") && innerWidth < 960) $("gesprek").style.top = vv.offsetTop + "px";
    else $("gesprek").style.top = "";
  };
  vv.addEventListener("resize", pas); vv.addEventListener("scroll", pas); pas();
}

(async function begin() {
  try { s.concepten = JSON.parse(sessionStorage.getItem("wa-concepten") || "{}") || {}; sessionStorage.removeItem("wa-concepten"); } catch (e) {}
  try { await laadLijst(); }
  catch (e) { $("lijstleeg").hidden = false; $("lijstleeg").textContent = "De lijst laadt niet: " + e.message; }
  const j = decodeURIComponent(location.hash.slice(1));
  if (j && s.chats.has(j)) { history.replaceState({ jid: j }, "", "#" + encodeURIComponent(j)); openChat(j, false); }
  setInterval(pols, 3000);
  setInterval(() => { if (document.hidden) return; if (s.filter === "wacht") tekenLijst(); if (s.open) tekenKop(); }, 60000);   // "wacht 12 min" loopt mee
})();
</script>
